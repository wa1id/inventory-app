<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e9ece7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141715" media="(prefers-color-scheme: dark)" />
    <title>Home inventory</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='23' rx='4' fill='%231c211e'/%3E%3Crect x='8' y='13' width='16' height='7' rx='1.5' fill='%23ffd23f'/%3E%3C/svg%3E"
    />
    <link
      rel="preload"
      href="/fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.25" />
        <path d="m15.2 15.2 5.3 5.3" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" /></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="10.5" width="14" height="10" rx="2" />
        <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" /></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" /></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="M4.5 19.5 5.5 15 15.8 4.7a1.8 1.8 0 0 1 2.5 0l1 1a1.8 1.8 0 0 1 0 2.5L9 18.5z" />
        <path d="m13.8 6.7 3.5 3.5" />
      </symbol>
      <symbol id="i-move" viewBox="0 0 24 24">
        <path d="M3.5 12h11M11 8l4 4-4 4" />
        <path d="M14 4.5h3.5a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H14" />
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="M4 11 12 4.5l8 6.5" />
        <path d="M6.5 9.5V19.5h11V9.5" />
      </symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24">
        <path d="M4 13.5 6.5 5.5h11l2.5 8v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" />
        <path d="M4 13.5h4.5l1.2 2.5h4.6l1.2-2.5H20" />
      </symbol>
      <symbol id="i-photo" viewBox="0 0 24 24">
        <rect x="3.5" y="5" width="17" height="14" rx="2" />
        <circle cx="9" cy="10" r="1.6" />
        <path d="m4.5 17.5 5-4.5 3.5 3 2.5-2 4 3.5" />
      </symbol>
      <symbol id="i-box" viewBox="0 0 24 24">
        <path d="M3.5 8 12 4l8.5 4v8.5L12 20.5l-8.5-4z" />
        <path d="M3.5 8 12 12l8.5-4M12 12v8.5" />
      </symbol>
      <symbol id="i-drawer" viewBox="0 0 24 24">
        <rect x="4" y="4.5" width="16" height="15" rx="2" />
        <path d="M4 12h16M10 8.25h4M10 15.75h4" />
      </symbol>
      <symbol id="i-shelf" viewBox="0 0 24 24">
        <path d="M4.5 4v16.5M19.5 4v16.5M4.5 10h15M4.5 16h15" />
        <path d="M7.5 10V6.5h3V10M13 16v-3.5h4.5V16" />
      </symbol>
      <symbol id="i-cabinet" viewBox="0 0 24 24">
        <rect x="5" y="3.5" width="14" height="17" rx="1.5" />
        <path d="M12 3.5v17M10 10.5v3M14 10.5v3" />
      </symbol>
      <symbol id="i-bin" viewBox="0 0 24 24">
        <path d="M3.5 5.5h17v3h-17z" />
        <path d="m5 8.5 1 10.4a1.6 1.6 0 0 0 1.6 1.4h8.8a1.6 1.6 0 0 0 1.6-1.4L19 8.5M10 12.5h4" />
      </symbol>
      <symbol id="i-bag" viewBox="0 0 24 24">
        <path d="M5.5 8.5h13l-1 11.5h-11z" />
        <path d="M9 8.5V7a3 3 0 0 1 6 0v1.5" />
      </symbol>
      <symbol id="i-crate" viewBox="0 0 24 24">
        <rect x="3.5" y="6" width="17" height="13" rx="1" />
        <path d="M3.5 10.5h17M3.5 14.5h17M7.5 6v13M16.5 6v13" />
      </symbol>
      <symbol id="i-other" viewBox="0 0 24 24">
        <path d="M4 12.2V5a1 1 0 0 1 1-1h7.2l7.8 7.8-8.2 8.2z" />
        <circle cx="8.5" cy="8.5" r="1.3" />
      </symbol>
    </svg>

    <div id="gate" class="gate" hidden>
      <form id="login" class="gate-card" novalidate>
        <p class="brand"><span class="brand-mark" aria-hidden="true"></span>Home inventory</p>
        <h1>Look something up</h1>
        <p class="gate-lede">
          Find where anything in the house is kept. Adding still happens on the phone.
        </p>
        <label class="field-label" for="password">Household password</label>
        <input
          id="password"
          class="input"
          type="password"
          name="password"
          autocomplete="current-password"
          enterkeyhint="go"
        />
        <p class="form-error" id="login-error" role="alert"></p>
        <button class="btn btn-primary btn-wide" id="login-submit" type="submit">Unlock</button>
      </form>
    </div>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <button
          class="icon-btn rail-toggle"
          id="rail-toggle"
          type="button"
          aria-label="Show spaces"
          aria-controls="rail"
          aria-expanded="false"
        >
          <svg class="icon" aria-hidden="true"><use href="#i-menu" /></svg>
        </button>
        <a class="brand" href="/" data-link
          ><span class="brand-mark" aria-hidden="true"></span
          ><span class="brand-name">Home inventory</span></a
        >
        <form id="search-form" class="search" role="search" action="/" autocomplete="off">
          <svg class="icon search-icon" aria-hidden="true"><use href="#i-search" /></svg>
          <input
            id="q"
            class="search-input"
            type="search"
            name="q"
            placeholder="Find an item, a space or a label code"
            aria-label="Search the household"
            spellcheck="false"
            enterkeyhint="search"
          />
          <kbd class="search-key" aria-hidden="true">/</kbd>
        </form>
        <p class="live-state" id="live-state" role="status" hidden>Reconnecting…</p>
        <button class="btn btn-quiet lock-btn" id="lock" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-lock" /></svg><span>Lock</span>
        </button>
      </header>

      <nav class="rail" id="rail" aria-label="Spaces"></nav>
      <div class="rail-scrim" id="rail-scrim" hidden></div>

      <main class="main" id="main" tabindex="-1"></main>

      <aside class="panel" id="panel" aria-labelledby="panel-title" hidden></aside>
    </div>

    <dialog class="dialog move-dialog" id="move-dialog" aria-labelledby="move-title">
      <div class="dialog-head">
        <h2 class="dialog-title" id="move-title">Move</h2>
        <button class="icon-btn" type="button" data-close-dialog aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
        </button>
      </div>
      <div class="move-filter">
        <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
        <input
          id="move-q"
          class="move-input"
          type="text"
          placeholder="Type a container, space or label code"
          aria-label="Find a container"
          role="combobox"
          aria-controls="move-list"
          aria-expanded="true"
          aria-autocomplete="list"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <div class="move-list" id="move-list" role="listbox" aria-label="Containers"></div>
      <p class="form-error move-error" id="move-error" role="alert"></p>
    </dialog>

    <dialog class="dialog photo-dialog" id="photo-dialog" aria-label="Photo">
      <button class="icon-btn photo-close" type="button" data-close-dialog aria-label="Close photo">
        <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
      </button>
      <img id="photo-full" alt="" />
    </dialog>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <p class="sr-only" id="announce" role="status" aria-live="polite"></p>

    <script src="/app.js" defer></script>
  </body>
</html>
