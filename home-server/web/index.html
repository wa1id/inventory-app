<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home · where is it</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="wrap">
      <section id="gate" class="gate hidden">
        <div class="mark">Household inventory</div>
        <h1>Look something up</h1>
        <p>This is the desk view. Adding still happens on the phone.</p>
        <form id="login">
          <input
            id="password"
            type="password"
            name="password"
            autocomplete="current-password"
            placeholder="Password"
          />
          <div class="err" id="login-error"></div>
          <button type="submit">Open</button>
        </form>
      </section>

      <section id="app" class="hidden">
        <header class="top">
          <a class="mark" href="/" data-go="/">Home</a>
          <button class="out" id="logout" type="button">Lock</button>
        </header>

        <div id="search-view">
          <form id="search-form" class="tape" action="javascript:void(0)">
            <input
              id="q"
              type="search"
              placeholder="Drill, loft, BOX-4F2A…"
              autocomplete="off"
              autofocus
            />
          </form>
          <p class="hint" id="status" role="status">Type what you remember</p>
          <div id="browse"></div>
          <div class="list" id="results"></div>
        </div>

        <div id="space-view" class="hidden">
          <button class="back" id="space-back" type="button">Back to home</button>
          <div id="space"></div>
        </div>

        <div id="container-view" class="hidden">
          <button class="back" id="container-back" type="button">Back</button>
          <div id="container"></div>
        </div>

        <div id="item-view" class="hidden">
          <button class="back" id="item-back" type="button">Back</button>
          <article class="detail" id="item">
            <div id="item-read"></div>
            <form id="edit-form" class="edit-form hidden" novalidate>
              <label for="edit-name">Name</label>
              <input id="edit-name" name="name" autocomplete="off" />
              <label for="edit-category">Category</label>
              <input id="edit-category" name="category" autocomplete="off" />
              <label for="edit-tags">Tags</label>
              <input id="edit-tags" name="tags" autocomplete="off" placeholder="comma, separated" />
              <label for="edit-quantity">Quantity</label>
              <div class="qty">
                <button type="button" id="edit-qty-dec" aria-label="Decrease quantity">−</button>
                <input
                  id="edit-quantity"
                  name="quantity"
                  type="text"
                  min="0"
                  inputmode="numeric"
                  enterkeyhint="done"
                  autocomplete="off"
                />
                <button type="button" id="edit-qty-inc" aria-label="Increase quantity">+</button>
              </div>
              <label for="edit-notes">Notes</label>
              <textarea id="edit-notes" name="notes"></textarea>
              <div class="err" id="edit-error"></div>
              <div class="actions">
                <button class="btn" id="edit-save" type="submit">Save</button>
                <button class="btn ghost" id="edit-cancel" type="button">Cancel</button>
              </div>
            </form>
            <div id="move-panel" class="move-panel hidden">
              <p class="section">Move to a container</p>
              <div class="list" id="move-list"></div>
              <div class="err" id="move-error"></div>
              <div class="actions">
                <button class="btn ghost" id="move-cancel" type="button">Cancel</button>
              </div>
            </div>
          </article>
        </div>
      </section>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
